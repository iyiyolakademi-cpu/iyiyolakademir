>DERS '+(i+1)+'</span><h3>'+esc(l.title)+'</h3><p style="white-space:pre-wrap">'+esc(l.body)+'</p><button data-lesson="'+l.id+'" style="background:#23543c;color:white;border:0;border-radius:8px;padding:11px 14px;cursor:pointer">Tamamladım ✓</button></article>').join(''):'<div class="empty">Bu eğitim için henüz yayınlanmış ders yok.</div>';list.addEventListener('click',async e=>{const b=e.target.closest('[data-lesson]');if(!b)return;const{data:{user}}=await db.auth.getUser();if(!user){location.href='hesabim.html#login';return}const{error}=await db.from('iya_course_progress').upsert({user_id:user.id,lesson_id:Number(b.dataset.lesson)},{onConflict:'user_id,lesson_id'});b.textContent=error?'Kaydedilemedi':'Tamamlandı ✓';b.disabled=!error})}};</script></body></html>
