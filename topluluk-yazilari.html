<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Topluluk Yazıları | İyi Yol Akademi</title><meta name="description" content="İyi Yol Akademi yazarlarının editör onaylı yazıları."><style>body{margin:0;background:#f7f8f5;color:#24392c;font:16px/1.75 system-ui,sans-serif}header{background:#fff;border-bottom:1px solid #e0e7df;padding:20px max(20px,calc((100vw - 950px)/2));display:flex;justify-content:space-between;gap:15px}a{color:#245d3c}main{max-width:950px;margin:0 auto;padding:40px 20px 90px}h1{font-size:clamp(34px,6vw,58px);letter-spacing:-.04em;line-height:1.1}h2{font-size:23px;line-height:1.3}.card{background:#fff;border:1px solid #e0e8df;padding:25px;margin:18px 0;border-radius:12px;cursor:pointer}.card:hover{border-color:#87aa8e}.meta{color:#6a7b6d;font-size:13px}#article{background:white;padding:clamp(20px,5vw,48px);border:1px solid #e0e8df;border-radius:12px;white-space:pre-wrap}button{border:0;background:#235239;color:white;padding:12px 18px;border-radius:8px;cursor:pointer}</style><link rel="stylesheet" href="white-edition.css?v=20261122white1"><style>.iya-new-logo{display:block!important;width:62px!important;height:62px!important;max-width:100%!important;object-fit:contain!important;background:#090a0d!important;border-radius:10px!important}header a:has(>.iya-new-logo){display:inline-flex!important;align-items:center!important;padding:0!important;background:transparent!important;border:0!important;line-height:1!important}</style></head><body><header><a href="index.html" aria-label="İyi Yol Akademi ana sayfa"><img src="brand-transparent.svg?v=20261122brand-fixed3" alt="İyi Yol Akademi" class="iya-new-logo"></a><a href="yazar-paneli.html">Yazar / Üye paneli</a></header><main><h1>Topluluk yazıları</h1><p>Yazarlarımızın editör onayından geçen yazılarını keşfet.</p><p id="status" role="status">Yazılar yükleniyor…</p><div id="list"></div><article id="article" hidden></article></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const db=createClient('https://byqfkrjiwefdnhnvjrbq.supabase.co','sb_publishable_NmrNx9632u62947Hol3DTw_n89-DYP_');
const $=id=>document.getElementById(id);const esc=t=>String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const id=new URLSearchParams(location.search).get('id');
if(id&&/^[0-9a-f-]{36}$/i.test(id)){
 const {data,error}=await db.from('iya_submissions').select('id,title,body,category,published_at,views,author_id').eq('id',id).eq('status','published').maybeSingle();
 if(error||!data){$('status').textContent='Yazı bulunamadı.'}else{
 document.title=data.title+' | İyi Yol Akademi';
 $('status').textContent='';
 $('list').hidden=true;$('article').hidden=false;
 $('article').innerHTML='<a href="topluluk-yazilari.html">← Tüm yazılar</a><h2>'+esc(data.title)+'</h2><p class="meta">'+esc(data.category)+' · '+new Date(data.published_at).toLocaleDateString('tr-TR')+' · '+Number(data.views)+' geçerli okuma</p><div>'+esc(data.body)+'</div>';
 // Her giriş yapmış okuyucu için yazı başına günde en fazla bir okuma.
 const {data:{user}}=await db.auth.getUser();
 if(user){await db.from('iya_reading_progress').upsert({user_id:user.id,article_id:id,last_read_at:new Date().toISOString()},{onConflict:'user_id,article_id'});if(user.id!==data.author_id)await db.rpc('iya_record_read',{p_article:id});}
 }
}else{
 const {data,error}=await db.from('iya_submissions').select('id,title,excerpt,category,published_at,views').eq('status','published').order('published_at',{ascending:false}).limit(50);
 $('status').textContent=error?'Yazılar yüklenemedi: '+error.message:(!data.length?'Henüz yayımlanan topluluk yazısı yok.':'');
 if(data)for(const a of data){const box=document.createElement('div');box.className='card';box.innerHTML='<h2>'+esc(a.title)+'</h2><p>'+esc(a.excerpt)+'</p><p class="meta">'+esc(a.category)+' · '+Number(a.views)+' okuma</p>';box.onclick=()=>location.href='topluluk-yazilari.html?id='+encodeURIComponent(a.id);$('list').append(box)}
}
</script></body></html>
