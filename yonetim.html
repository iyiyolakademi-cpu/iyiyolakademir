<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yönetim Paneli | İyi Yol Akademi</title><link rel="stylesheet" href="academy.css"></head><body><header class="top"><a class="brand" href="index.html">iyi<span>yol.</span><small>AKADEMİ</small></a><nav><a href="egitimler.html">Eğitimler</a><a href="index.html">Siteye dön</a></nav><div class="auth"><a href="hesabim.html">Hesabım</a></div></header><main class="section"><p class="eyebrow">YÖNETİCİ ALANI</p><h1 style="font:600 48px Playfair Display,serif">Akademi yönetimi</h1><div id="gate" class="empty">Yetkiler kontrol ediliyor…</div><section id="admin" hidden><div class="cards"><article class="card"><h3>Yeni eğitim</h3><form id="courseForm"><p><input name="title" required placeholder="Eğitim başlığı" style="width:100%;padding:12px"></p><p><input name="slug" required pattern="[a-z0-9-]+" placeholder="egitim-adresi" style="width:100%;padding:12px"></p><p><input name="category" placeholder="Kategori" style="width:100%;padding:12px"></p><p><textarea name="description" placeholder="Açıklama" style="width:100%;padding:12px"></textarea></p><button class="primary" style="padding:12px;border:0;border-radius:8px">Taslak oluştur</button></form></article><article class="card"><h3>Yeni ders</h3><form id="lessonForm"><p><select name="course_id" id="courseSelect" required style="width:100%;padding:12px"></select></p><p><input name="title" required placeholder="Ders başlığı" style="width:100%;padding:12px"></p><p><textarea name="body" required placeholder="Ders içeriği" rows="5" style="width:100%;padding:12px"></textarea></p><button class="primary" style="padding:12px;border:0;border-radius:8px">Taslak ders ekle</button></form></article><article class="card"><h3>Eğitimleri ve dersleri yönet</h3><div id="courseList">Yükleniyor…</div><h3>Dersler</h3><div id="lessonList">Yükleniyor…</div></article></div><p id="status" role="status"></p></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';const db=createClient('https://byqfkrjiwefdnhnvjrbq.supabase.co','sb_publishable_NmrNx9632u62947Hol3DTw_n89-DYP_');const gate=document.getElementById('gate'),panel=document.getElementById('admin'),status=document.getElementById('status');const{data:{user}}=await db.auth.getUser();if(!user){gate.innerHTML='<p>Yönetim paneli için giriş yapmalısın.</p><a href="hesabim.html#login">Giriş yap →</a>'}else{const{data:{session}}=await db.auth.getSession();const role=session?.user?.app_metadata?.role;if(role!=='admin'){gate.textContent='Bu sayfaya yalnızca yetkili yöneticiler erişebilir.'}else{gate.hidden=true;panel.hidden=false;await refresh()}}async function refresh(){const{data,error}=await db.from('iya_courses').select('id,title,published').order('id',{ascending:false});if(error){status.textContent=error.message;return}const sel=document.getElementById('courseSelect'),list=document.getElementById('courseList');sel.replaceChildren(...(data||[]).map(c=>{let o=document.createElement('option');o.value=c.id;o.textContent=c.title;return o}));list.replaceChildren(...(data||[]).map(c=>{let p=document.createElement('p'),b=document.createElement('button');p.textContent=c.title+' · ';b.textContent=c.published?'Yayından kaldır':'Yayınla';b.type='button';b.onclick=async()=>{const{error}=await db.from('iya_courses').update({published:!c.published}).eq('id',c.id);status.textContent=error?error.message:'Durum güncellendi';if(!error)refresh()};p.append(b);return p}));const{data:lessons}=await db.from('iya_lessons').select('id,title,published,course_id').order('id',{ascending:false});const lessonList=document.getElementById('lessonList');lessonList.replaceChildren(...(lessons||[]).map(l=>{let p=document.createElement('p'),b=document.createElement('button');p.textContent=l.title+' · ';b.textContent=l.published?'Yayından kaldır':'Yayınla';b.type='button';b.onclick=async()=>{const{error}=await db.from('iya_lessons').update({published:!l.published}).eq('id',l.id);status.textContent=error?error.message:'Ders durumu güncellendi';if(!error)refresh()};p.append(b);return p}))}document.getElementById('courseForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const{error}=await db.from('iya_courses').insert({title:f.get('title'),slug:f.get('slug'),category:f.get('category')||'Genel',description:f.get('description')||'',published:false});status.textContent=error?error.message:'Taslak eğitim oluşturuldu';if(!error){e.target.reset();refresh()}};document.getElementById('lessonForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const{error}=await db.from('iya_lessons').insert({course_id:Number(f.get('course_id')),title:f.get('title'),body:f.get('body'),published:false});status.textContent=error?error.message:'Taslak ders oluşturuldu';if(!error)e.target.reset()};</script></body></html>
